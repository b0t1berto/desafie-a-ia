<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio IA — Reconhecimento de Desenhos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Desenhe e a IA adivinha</h1>
      <p class="app__subtitle">
        Rabisque qualquer coisa — gato, casa, bicicleta, guarda-chuva — e o
        modelo DoodleNet tenta reconhecer entre 345 categorias.
      </p>
    </header>

    <section class="drawing" aria-label="Área de desenho">
      <canvas
        id="drawing-canvas"
        class="drawing__canvas"
        width="400"
        height="400"
        aria-label="Quadro de desenho 400 por 400 pixels">
        Seu navegador não suporta canvas.
      </canvas>
    </section>

    <section class="actions">
      <button id="clear-button" class="button button--secondary" type="button">
        Limpar
      </button>
      <button id="guess-button" class="button button--primary" type="button">
        Adivinhar
      </button>
    </section>

    <section
      id="result"
      class="result"
      role="status"
      aria-live="polite">
      <p class="result__placeholder">Carregando IA...</p>
    </section>
  </main>

  <script defer src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <script defer src="js/canvas.js"></script>
  <script defer src="js/preprocessamento.js"></script>
  <script defer src="js/classificador.js"></script>
  <script defer src="js/resultado.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
