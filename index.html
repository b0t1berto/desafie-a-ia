<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio IA — Modo Jogo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">


    <section class="drawing" aria-label="Área de desenho">
      <canvas
        id="drawing-canvas"
        class="drawing__canvas"
        width="400"
        height="400"
        aria-label="Quadro de desenho 400 por 400 pixels">
        Seu navegador não suporta canvas.
      </canvas>
    </section>

    <section class="actions">
      <button id="clear-button" class="button button--secondary" type="button">
        Limpar
      </button>
    </section>

    <section id="jogo" class="jogo" aria-label="Modo jogo">
      <div class="jogo__header">
        <h1 class="jogo__titulo">Modo Jogo</h1>
        <span class="jogo__placar">
          Pontos: <span id="jogo-pontos">0</span> &bull;
          Recorde: <span id="jogo-recorde">0</span>
        </span>
      </div>
      <div class="jogo__controles">
        <button id="jogo-iniciar" class="button button--primary" type="button">
          Iniciar jogo
        </button>
      </div>
      <p class="jogo__palavra" id="jogo-palavra"></p>
      <p class="jogo__tempo" id="jogo-tempo"></p>
      <p class="jogo__palpite-ia" id="jogo-palpite-ia"></p>
      <p class="jogo__feedback" id="jogo-feedback"></p>
    </section>

    <section
      id="result"
      class="result"
      role="status"
      aria-live="polite"
      hidden>
      <p class="result__placeholder">Carregando IA...</p>
    </section>
  </main>

  <script defer src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <script defer src="js/canvas.js"></script>
  <script defer src="js/preprocessamento.js"></script>
  <script defer src="js/classificador.js"></script>
  <script defer src="js/resultado.js"></script>
  <script defer src="js/jogo.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
