<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste automatizado — DoodleNet</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <section class="drawing">
      <canvas id="drawing-canvas" class="drawing__canvas" width="400" height="400"></canvas>
    </section>

    <section class="actions">
      <button id="clear-button" class="button button--secondary" type="button">Limpar</button>
    </section>

    <section id="result" class="result" role="status" aria-live="polite">
      <p class="result__placeholder">Carregando o modelo DoodleNet...</p>
    </section>

    <pre id="log" class="result__nota">iniciando...</pre>
  </main>

  <script defer src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
  <script defer src="js/canvas.js"></script>
  <script defer src="js/preprocessamento.js"></script>
  <script defer src="js/classificador.js"></script>
  <script defer src="js/resultado.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/teste-harness.js"></script>
</body>
</html>
